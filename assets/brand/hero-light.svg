      <rect x="132" width="124" height="34" rx="17" fill="#FFFFFF" stroke="#DCE3EA"/><text x="151" y="22" fill="#168B61">EXACT TERMS</text>
      <rect x="270" width="126" height="34" rx="17" fill="#FFFFFF" stroke="#DCE3EA"/><text x="287" y="22" fill="#007E9E">SECRET-FREE</text>
      <rect x="410" width="112" height="34" rx="17" fill="#FFFFFF" stroke="#DCE3EA"/><text x="429" y="22" fill="#168B61">PORTABLE</text>
