<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Personal Trust Fabric — Authority Fabric</title>
<desc id="desc">User-owned authority for interchangeable AI agents. Multiple agents route through one deterministic Personal Trust Fabric authority gate before protected systems.</desc>
<defs>
  <linearGradient id="laccent" x1="62" y1="62" x2="1130" y2="390" gradientUnits="userSpaceOnUse">
    <stop stop-color="#007E9E"/>
    <stop offset="1" stop-color="#168B61"/>
  </linearGradient>
  <pattern id="lgrid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#EAF0F4" stroke-width="1"/>
  </pattern>
</defs>
<rect width="1200" height="440" rx="30" fill="#F7F9FB"/>
<rect width="1200" height="440" rx="30" fill="url(#lgrid)" opacity=".7"/>
<rect x="28" y="28" width="1144" height="384" rx="24" fill="none" stroke="#DCE3EA"/>
