<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Illustrative PTF authority trace</title>
<desc id="desc">An example authority trace shows verified actor, bounded action, resource, ceiling, purpose, secret handling and an allow decision with a secret-free receipt.</desc>
<rect width="1200" height="330" rx="26" fill="#0B0F14"/>
<rect x="24" y="24" width="1152" height="282" rx="22" fill="none" stroke="#25303C"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<text x="62" y="68" fill="#F4F7FA" font-size="23" font-weight="740">Illustrative authority trace</text>
<text x="62" y="94" fill="#95A1AF" font-size="14">The model proposes. PTF evaluates exact terms. The external effect receives only what was authorized.</text>
<g transform="translate(62 126)">
  <rect width="770" height="142" rx="18" fill="#111821" stroke="#25303C"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
    <text x="24" y="31" fill="#95A1AF">actor</text><text x="178" y="31" fill="#F4F7FA">did:agent:travel</text><text x="630" y="31" fill="#62E6A7">verified</text>
    <text x="24" y="57" fill="#95A1AF">action</text><text x="178" y="57" fill="#F4F7FA">/travel/book</text><text x="630" y="57" fill="#49D7FF">exact</text>
    <text x="24" y="83" fill="#95A1AF">resource</text><text x="178" y="83" fill="#F4F7FA">flight:AI812</text><text x="630" y="83" fill="#49D7FF">bound</text>
    <text x="24" y="109" fill="#95A1AF">ceiling</text><text x="178" y="109" fill="#F4F7FA">INR 15,000</text><text x="630" y="109" fill="#F2B84B">limited</text>
    <text x="24" y="135" fill="#95A1AF">secret</text><text x="178" y="135" fill="#F4F7FA">payment instrument</text><text x="630" y="135" fill="#62E6A7">not disclosed</text>
  </g>
  <path d="M794 71h66" stroke="#49D7FF" stroke-width="2.2"/>
  <path d="M851 61l12 10-12 10" fill="none" stroke="#49D7FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="870" y="21" width="232" height="100" rx="18" fill="#111821" stroke="#62E6A7" stroke-width="2"/>
  <text x="896" y="53" fill="#62E6A7" font-size="13" font-weight="760" letter-spacing="1.5">ALLOW</text>
  <text x="896" y="79" fill="#F4F7FA" font-size="16" font-weight="680">bounded execution</text>
  <text x="896" y="101" fill="#95A1AF" font-size="12">secret-free receipt outward</text>
</g>
</g>
</svg>