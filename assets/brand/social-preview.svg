<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Personal Trust Fabric</title>
  <desc id="desc">Authority without possession. Multiple agents route through PTF while secrets remain behind the protected boundary.</desc>

  <rect width="1280" height="640" fill="#0D1117"/>
  <rect x="72" y="64" width="6" height="512" fill="#FF6A1A"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="116" y="112" fill="#FF6A1A" font-size="24" font-weight="700">PTF/</text>
    <text x="116" y="206" fill="#F0F6FC" font-size="74" font-weight="760" letter-spacing="-2.8">AUTHORITY</text>
    <text x="116" y="286" fill="#F0F6FC" font-size="74" font-weight="760" letter-spacing="-2.8">WITHOUT</text>
    <text x="116" y="366" fill="#F0F6FC" font-size="74" font-weight="760" letter-spacing="-2.8">POSSESSION</text>
    <text x="118" y="430" fill="#8B949E" font-size="22">User-owned authority for interchangeable AI agents.</text>
  </g>

  <g transform="translate(720 124)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="0" y="0" fill="#8B949E" font-size="17">agent A</text>
    <text x="0" y="72" fill="#8B949E" font-size="17">agent B</text>
    <text x="0" y="144" fill="#8B949E" font-size="17">local</text>

    <path d="M88 -6 H230" stroke="#8B949E" stroke-width="2"/>
    <path d="M88 66 H230" stroke="#8B949E" stroke-width="2"/>
    <path d="M88 138 H230" stroke="#8B949E" stroke-width="2"/>

    <path d="M220 -13 L230 -6 L220 1" fill="none" stroke="#8B949E" stroke-width="2"/>
    <path d="M220 59 L230 66 L220 73" fill="none" stroke="#8B949E" stroke-width="2"/>
    <path d="M220 131 L230 138 L220 145" fill="none" stroke="#8B949E" stroke-width="2"/>

    <rect x="246" y="-34" width="132" height="204" fill="none" stroke="#FF6A1A" stroke-width="3"/>
    <text x="312" y="58" text-anchor="middle" fill="#F0F6FC" font-size="28" font-weight="700">PTF</text>
    <text x="312" y="91" text-anchor="middle" fill="#8B949E" font-size="14">authority</text>

    <path d="M378 34 H494" stroke="#F0F6FC" stroke-width="2"/>
    <path d="M484 27 L494 34 L484 41" fill="none" stroke="#F0F6FC" stroke-width="2"/>
    <text x="512" y="40" fill="#F0F6FC" font-size="17">action</text>

    <path d="M378 106 H494" stroke="#F0F6FC" stroke-width="2"/>
    <path d="M484 99 L494 106 L484 113" fill="none" stroke="#F0F6FC" stroke-width="2"/>
    <text x="512" y="112" fill="#F0F6FC" font-size="17">receipt</text>

    <path d="M312 170 V252" stroke="#FF6A1A" stroke-width="3"/>
    <path d="M305 242 L312 252 L319 242" fill="none" stroke="#FF6A1A" stroke-width="2.5"/>
    <text x="312" y="286" text-anchor="middle" fill="#FF6A1A" font-size="17" font-weight="700">secret stays</text>
    <text x="312" y="312" text-anchor="middle" fill="#8B949E" font-size="15">behind the boundary</text>
  </g>

  <line x1="116" y1="510" x2="640" y2="510" stroke="#30363D" stroke-width="1"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18">
    <text x="116" y="548" fill="#F0F6FC">Default deny.</text>
    <text x="250" y="548" fill="#F0F6FC">Exact terms.</text>
    <text x="376" y="548" fill="#F0F6FC">Use without possession.</text>
  </g>
</svg>