<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">PTF authority trace</title>
<desc id="desc">An example authority trace shows verified actor, bounded action, resource, ceiling, purpose, secret handling and an allow decision with a secret-free receipt.</desc>
<rect width="1200" height="330" rx="26" fill="#F7F9FB"/>
<rect x="24" y="24" width="1152" height="282" rx="22" fill="none" stroke="#DCE3EA"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<text x="62" y="68" fill="#10151C" font-size="23" font-weight="740">Authority trace</text>
<text x="62" y="94" fill="#5E6A78" font-size="14">The model proposes. PTF evaluates exact terms. The external effect receives only what was authorized.</text>
<g transform="translate(62 126)">
  <rect width="770" height="142" rx="18" fill="#FFFFFF" stroke="#DCE3EA"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
    <text x="24" y="31" fill="#5E6A78">actor</text><text x="178" y="31" fill="#10151C">did:agent:travel</text><text x="630" y="31" fill="#168B61">verified</text>
    <text x="24" y="57" fill="#5E6A78">action</text><text x="178" y="57" fill="#10151C">/travel/book</text><text x="630" y="57" fill="#007E9E">exact</text>
    <text x="24" y="83" fill="#5E6A78">resource</text><text x="178" y="83" fill="#10151C">flight:AI812</text><text x="630" y="83" fill="#007E9E">bound</text>
    <text x="24" y="109" fill="#5E6A78">ceiling</text><text x="178" y="109" fill="#10151C">INR 15,000</text><text x="630" y="109" fill="#A56800">limited</text>
    <text x="24" y="135" fill="#5E6A78">secret</text><text x="178" y="135" fill="#10151C">payment instrument</text><text x="630" y="135" fill="#168B61">not disclosed</text>
  </g>
  <path d="M794 71h66" stroke="#007E9E" stroke-width="2.2"/>
  <path d="M851 61l12 10-12 10" fill="none" stroke="#007E9E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="870" y="21" width="232" height="100" rx="18" fill="#FFFFFF" stroke="#168B61" stroke-width="2"/>
  <text x="896" y="53" fill="#168B61" font-size="13" font-weight="760" letter-spacing="1.5">ALLOW</text>
  <text x="896" y="79" fill="#10151C" font-size="16" font-weight="680">bounded execution</text>
  <text x="896" y="101" fill="#5E6A78" font-size="12">secret-free receipt outward</text>
</g>
</g>
</svg>