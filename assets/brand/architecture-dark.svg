<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">PTF architecture at a glance</title>
<desc id="desc">Personal State, Authority State and Audit State converge in the deterministic PTF decision engine, which grants bounded access to interchangeable agents and protected systems.</desc>
<defs><linearGradient id="adg" x1="120" y1="40" x2="1080" y2="350"><stop stop-color="#49D7FF"/><stop offset="1" stop-color="#62E6A7"/></linearGradient></defs>
<rect width="1200" height="390" rx="26" fill="#0B0F14"/>
<rect x="24" y="24" width="1152" height="342" rx="22" fill="none" stroke="#25303C"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<text x="62" y="68" fill="#F4F7FA" font-size="24" font-weight="740">The 30-second model</text>
<text x="62" y="94" fill="#95A1AF" font-size="15">State stays with the person. Agents borrow bounded authority; they do not inherit possession.</text>
<g transform="translate(64 132)">
  <g fill="#111821" stroke="#25303C">
    <rect width="210" height="62" rx="15"/><rect y="78" width="210" height="62" rx="15"/><rect y="156" width="210" height="62" rx="15"/>
  </g>
  <g fill="#F4F7FA" font-size="15" font-weight="670"><text x="24" y="38">Personal State</text><text x="24" y="116">Authority State</text><text x="24" y="194">Audit State</text></g>
  <g stroke="#49D7FF" stroke-width="2" fill="none"><path d="M210 31h88l42 77"/><path d="M210 109h130"/><path d="M210 187h88l42-78"/></g>
  <rect x="340" y="66" width="216" height="88" rx="20" fill="#111821" stroke="url(#adg)" stroke-width="2.4"/>
  <text x="448" y="103" text-anchor="middle" fill="#F4F7FA" font-size="20" font-weight="760">PTF decision engine</text>
  <text x="448" y="128" text-anchor="middle" fill="#95A1AF" font-size="12">deterministic · cited · default-deny</text>
  <path d="M556 110h94" stroke="#62E6A7" stroke-width="2"/>
  <circle cx="607" cy="110" r="5" fill="#62E6A7"/>
  <g fill="#111821" stroke="#25303C">
    <rect x="650" y="0" width="196" height="54" rx="14"/><rect x="650" y="66" width="196" height="54" rx="14"/><rect x="650" y="132" width="196" height="54" rx="14"/>
  </g>
  <g fill="#F4F7FA" font-size="14" font-weight="650"><text x="674" y="33">Agent runtime A</text><text x="674" y="99">Agent runtime B</text><text x="674" y="165">Local / specialist agent</text></g>
  <g stroke="#62E6A7" stroke-width="2" fill="none"><path d="M846 27h78l32 70"/><path d="M846 93h110"/><path d="M846 159h78l32-66"/></g>
  <rect x="956" y="54" width="170" height="108" rx="18" fill="#111821" stroke="#25303C"/>
  <text x="1041" y="88" text-anchor="middle" fill="#F4F7FA" font-size="15" font-weight="690">Protected systems</text>
  <text x="1041" y="115" text-anchor="middle" fill="#95A1AF" font-size="12">identity · signing</text>
  <text x="1041" y="136" text-anchor="middle" fill="#95A1AF" font-size="12">travel · APIs · payment</text>
</g>
