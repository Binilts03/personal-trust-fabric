name: temporary prerelease dependency lock refresh

# One-time, read-only lock resolution on GitHub-hosted npm registry access.
# Remove this workflow after the reviewed lockfile is committed.
on:
  push:
    branches:
      - docs/prerelease-accuracy-20261115

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve security fixes within existing declared semver ranges
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Emit the changed lockfile for review (base64 chunks, no credentials)
        run: |
          node -e 'const b=require("node:fs").readFileSync("package-lock.json").toString("base64");for(let i=0;i<b.length;i+=2000) console.log("PTF_LOCK_CHUNK:"+b.slice(i,i+2000))'
      - name: Confirm production dependency vulnerability state
        run: npm audit --omit=dev
