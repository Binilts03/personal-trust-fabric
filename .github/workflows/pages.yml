name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-ruby@d4c9384a6a4e2a2c8e44a4e3a7d2f4a8e2f8c4b3 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728e80a9a4b4b6c7e0c5b5f4e6 # v5
      - name: Build with Jekyll
        run: bundle exec jekyll build --destination _site
        working-directory: docs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c6c7 # v4
