name: ci

on:
  push:
  pull_request:

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:brand
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval
      - name: seam check (tests via public barrel; bins exempt)
        run: |
          if grep -R 'from "\.\./src/[^"]*\.js"' tests --include="*.ts" | grep -v 'from "\.\./src/index\.js"' | grep -v 'from "\.\./src/cli\.js"' | grep -v 'from "\.\./src/mcp-server\.js"' | grep -v 'from "\.\./src/pdp-server\.js"'; then
            echo "FAIL: test reaches past public seam"; exit 1;
          fi
      - name: zero-dep check (core is node:crypto + relative only)
        run: |
          if grep -R 'from "' src/core --include="*.ts" | grep -v 'from "node:crypto"' | grep -v 'from "\./' | grep -v 'from "\.\./'; then
            echo "FAIL: core has non-allowlisted import"; exit 1;
          fi
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          extra_args: --only-verified
