name: ci

on:
  push:
  pull_request:

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:brand
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval
      # One implementation shared with scripts/harness.sh: seam rules cannot drift.
      - name: seam + zero-dep checks (tests via public barrel; bins exempt)
        run: node scripts/check-seams.mjs
      # What a consumer actually receives: the export map, the bins, and an
      # install of the tarball into a clean directory.
      - name: package surface (install the tarball, import the entry point)
        run: npm run verify:package -- --install
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
          working-directory: docs
      - name: Install gems
        run: bundle install
        working-directory: docs
      - name: Build docs site (required — changes touching docs must keep this green)
        run: bundle exec jekyll build --destination _site
        working-directory: docs
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          extra_args: --only-verified
