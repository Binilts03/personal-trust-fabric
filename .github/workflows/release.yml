name: release

# Tagged releases ship SLSA Build L3 provenance plus a CycloneDX SBOM.
# First run happens on the first pushed tag (v*); see docs/hygiene.md.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: mkdir -p release-assets && npm pack --pack-destination release-assets
      - run: npm sbom --sbom-format=cyclonedx --omit=dev > release-assets/sbom.cdx.json
      - id: hash
        run: |
          cd release-assets
          echo "hashes=$(sha256sum personal-trust-fabric-*.tgz sbom.cdx.json | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
      # Private repository: required for Sigstore signing to work correctly.
      private-repository: true

  github-release:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: provenance
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            release-assets/personal-trust-fabric-*.tgz
            release-assets/sbom.cdx.json
            provenance/*.intoto.jsonl
