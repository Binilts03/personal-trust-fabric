name: release

# Tagged releases ship SLSA Build L3 provenance plus a CycloneDX SBOM.
# First run happens on the first pushed tag (v*); see docs/hygiene.md.

on:
  push:
    tags: ["v*"]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --pack-destination release-assets
      - run: npm sbom --sbom-format=cyclonedx-json --omit=dev > release-assets/sbom.cdx.json
      - id: hash
        run: |
          cd release-assets
          echo "hashes=$(sha256sum personal-trust-fabric-*.tgz sbom.cdx.json | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true

  github-release:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: provenance
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/personal-trust-fabric-*.tgz
            release-assets/sbom.cdx.json
            provenance/*.intoto.jsonl
