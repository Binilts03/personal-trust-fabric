name: Scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: "30 1 * * 6"
  push:
    branches: [main]
permissions: {}
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      # Recommended reads for private repos (per upstream docs): without these,
      # GraphQL ListCommits fails with "Resource not accessible by integration".
      contents: read
      issues: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_format: sarif
          results_file: results.sarif
          # Default GITHUB_TOKEN is the documented path; no PAT needed unless
          # classic branch-protection details must be visible (see upstream
          # docs/authentication/fine-grained-auth-token.md — Administration
          # read-only). A PAT here OAuth-shadows the job token, so leave it out.
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      # NOTE: no codeql-action/upload-sarif step — the code-scanning API needs
      # GitHub Advanced Security, unavailable on private repos without it.
      # Results live in the run artifacts above. Re-add the upload step if GHAS
      # is enabled or the repo goes public.
