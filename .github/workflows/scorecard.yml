name: Scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: "30 1 * * 6"
  push:
    branches: [main]
permissions: read-all
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_format: sarif
          results_file: results.sarif
          # Private repos need a PAT with repo read; the default token cannot
          # run all checks (ListCommits fails). Create it once:
          #   profile → Settings → Developer settings → Personal access tokens
          #   → Tokens (classic), `repo` scope → repo secret SCORECARD_READ_TOKEN.
          # Public repos can drop this line (default token suffices).
          repo_token: ${{ secrets.SCORECARD_READ_TOKEN }}
          publish_results: true
      - uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@v4.38.0
        with:
          sarif_file: results.sarif
