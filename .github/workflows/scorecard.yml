name: Scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: "30 1 * * 6"
  push:
    branches: [main]
permissions: {}
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      issues: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_format: sarif
          results_file: results.sarif
          # Default GITHUB_TOKEN is the documented path; no PAT needed unless
          # classic branch-protection details must be visible (see upstream
          # docs/authentication/fine-grained-auth-token.md — Administration
          # read-only). A PAT here OAuth-shadows the job token, so leave it out.
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      # Keep the SARIF as a short-lived workflow artifact; publishing policy can be changed independently.
