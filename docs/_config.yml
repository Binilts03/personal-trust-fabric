title: Personal Trust Fabric
description: User-owned trust and delegated-authority layer for the agentic web
theme: just-the-docs

url: https://binilts03.github.io
baseurl: /personal-trust-fabric

search_enabled: true
heading_anchors: true
permalink: pretty

aux_links:
  "GitHub Repository":
    - "https://github.com/Binilts03/personal-trust-fabric"
  "Issues":
    - "https://github.com/Binilts03/personal-trust-fabric/issues"
  "Discussions":
    - "https://github.com/Binilts03/personal-trust-fabric/discussions"

color_scheme: auto

plugins:
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-seo-tag

github:
  repo: "Binilts03/personal-trust-fabric"
  repository_url: "https://github.com/Binilts03/personal-trust-fabric"

# Collections for different doc categories
collections:
  adr:
    output: true
    permalink: /adr/:name/
  audit:
    output: true
    permalink: /audit/:name/
  research:
    output: true
    permalink: /research/:name/
  profiles:
    output: true
    permalink: /profiles/:name/

defaults:
  - scope:
      path: ""
      type: "adr"
    values:
      layout: "default"
      nav_order: 1
  - scope:
      path: ""
      type: "audit"
    values:
      layout: "default"
      nav_order: 2
  - scope:
      path: ""
      type: "research"
    values:
      layout: "default"
      nav_order: 3
  - scope:
      path: ""
      type: "profiles"
    values:
      layout: "default"
      nav_order: 4
